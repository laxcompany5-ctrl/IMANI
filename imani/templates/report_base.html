<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Report{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
</head>
<body class="report-body">
  <div class="report-toolbar no-print">
    <a class="report-back" href="{{ back_url or url_for('dashboard.index') }}">&larr; Back</a>
    <button class="report-print" type="button" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <main class="report-sheet">
    <header class="report-head">
      <div class="report-brand">
        {{ app_name }}
        <small>{{ app_tagline }}</small>
      </div>
      <div class="report-meta">
        {% block report_meta %}Official report{% endblock %}<br>
        Generated {{ generated }}
      </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="report-foot">
      <span>{{ app_name }} — {{ app_tagline }}</span>
      <span>Generated {{ generated }}</span>
    </footer>
  </main>
</body>
</html>
