# IMANI — nginx reverse proxy
# Place in /etc/nginx/sites-available/imani and symlink into sites-enabled.
# Then run:  sudo certbot --nginx -d imani.co.ke -d www.imani.co.ke
# to obtain a free Let's Encrypt certificate and enable HTTPS automatically.

server {
    listen 80;
    listen [::]:80;
    server_name imani.co.ke www.imani.co.ke;

    # Serve static assets directly for speed.
    location /static/ {
        alias /opt/imani/imani/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30;
    }
}
