# IMANI — nginx reverse proxy for a real domain.
# Replace imani-demo.duckdns.org with your hostname, then:
#   sudo certbot --nginx -d imani-demo.duckdns.org

server {
    listen 80;
    listen [::]:80;
    server_name imani-demo.duckdns.org;

    # Phone frames, imported source videos and ZIPs can be large.
    client_max_body_size 512M;

    # Static assets are served directly by nginx.
    location /static/ {
        alias /opt/imani/imani/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to the single gunicorn worker.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # Needed for byte-range video playback and long video imports.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        send_timeout 300;
    }
}
